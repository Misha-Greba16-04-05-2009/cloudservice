server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cloud-storage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloud}
    username: ${DB_USERNAME:cloud}
    password: ${DB_PASSWORD:cloud}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
